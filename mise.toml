[tools]
swiftformat = "0.62.1"
swiftlint = "0.65.0"

[tasks.format]
description = "Format Swift sources in place"
run = "swiftformat ."

[tasks.lint]
description = "Check formatting and lint (CI-strict)"
run = ["swiftformat --lint .", "swiftlint --strict"]

[tasks.setup]
description = "Point git at the repo's hooks"
run = "git config core.hooksPath Scripts/git-hooks"
