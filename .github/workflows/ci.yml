name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Standard GitHub-hosted macOS runners are free for public repositories.
# Match the release toolchain (Xcode 27.1 on macOS 27) and pin it, so a change to
# the image's default Xcode can't silently change CI. The xcode-27 image is
# still a GitHub preview; fall back to macos-26 if it turns unstable.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/check-localizations.sh
      - run: swift build
      - run: swift test --no-parallel

  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: mise run lint
