name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so only the latest revision consumes hosted capacity.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: zsh {0}

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: swift build
      - run: swift test --no-parallel

  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: jdx/mise-action@v3
      - run: mise run lint
